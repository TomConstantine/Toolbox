<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortho viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/georaster-layer-for-leaflet@3.10.0/dist/v3/webpack/bundle/georaster-layer-for-leaflet.min.js"></script>
<style>
:root{--bg:#1b2124;--fg:#e9eef0;--mut:#8fa0a6;--acc:#f2b84b;--line:#33403f}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:13px/1.35 system-ui,sans-serif}
#map{height:100%;background:#2a3033}
#panel{position:absolute;top:10px;left:10px;z-index:1000;width:292px;max-height:calc(100% - 20px);overflow:auto;background:var(--bg);color:var(--fg);border-radius:8px;padding:10px;box-shadow:0 2px 14px #0007}
#panel .row{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
#panel b{flex:1;font-size:14px}
button,select{font:inherit;background:#2a3438;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1b2124;border-color:var(--acc)}
select{max-width:100px}
.lr{display:grid;grid-template-columns:1fr 70px auto auto;gap:6px;align-items:center;margin:4px 0}
.lr label{display:flex;gap:5px;overflow:hidden;white-space:nowrap}
.lr span{overflow:hidden;text-overflow:ellipsis}
.lr input[type=range]{width:70px;accent-color:var(--acc)}
.hint,#info{color:var(--mut);margin:6px 0 0}
#info{min-height:2.7em;color:var(--fg)}
#cmp{position:absolute;inset:0;z-index:900;pointer-events:none;display:none}
#bar{position:absolute;top:0;bottom:0;left:50%;width:22px;margin-left:-11px;pointer-events:auto;cursor:ew-resize;touch-action:none;background:linear-gradient(90deg,transparent 10px,#fff 10px,#fff 12px,transparent 12px)}
#bar::after{content:"\2194";position:absolute;top:50%;left:0;width:22px;height:34px;margin-top:-17px;display:grid;place-items:center;background:#fff;color:#222;border-radius:11px;box-shadow:0 1px 6px #0008}
.pin{background:var(--acc);border:2px solid #fff;border-radius:50%;box-shadow:0 0 4px #000a}
.leaflet-tooltip.tip{background:#1b2124e6;color:#fff;border:1px solid var(--acc);font-weight:600}
#drop{position:absolute;inset:0;z-index:1500;display:none;place-items:center;background:#000a;color:#fff;font-size:20px;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="cmp"><div id="bar"></div></div>
<div id="drop">Drop GeoTIFF files to load</div>
<div id="panel">
  <div class="row"><b>Ortho viewer</b><button id="open">Open</button><button id="url">URL</button>
    <input type="file" id="file" accept=".tif,.tiff,image/tiff" multiple hidden></div>
  <div id="layers"></div>
  <div class="row">Basemap
    <select id="base"><option value="osm">OpenStreetMap</option><option value="esri">Esri imagery</option><option value="none">None</option></select></div>
  <div class="row"><label><input type="checkbox" id="cmpOn"> Compare</label>
    <select id="selL" title="Left"></select><select id="selR" title="Right"></select></div>
  <div class="row" id="tools">
    <button data-t="dist">Distance</button><button data-t="area">Area</button><button data-t="note">Note</button>
    <button id="undo">Undo</button><button id="clear">Clear</button><button id="exp">Export</button></div>
  <div id="info"></div>
  <p class="hint">Double-click or Enter finishes a line or area, Esc cancels. Right-click a shape to delete it.</p>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const map = L.map('map', {maxZoom: 22, zoomSnap: 0.5, preferCanvas: true}).setView([54, -2], 6);
const bases = {
  osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 22, maxNativeZoom: 19, attribution: '&copy; OpenStreetMap contributors'}),
  esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 22, maxNativeZoom: 19, attribution: 'Tiles &copy; Esri'}),
  none: L.layerGroup()
};
let base = bases.osm.addTo(map);
$('#base').onchange = e => { map.removeLayer(base); base = bases[e.target.value].addTo(map); if (base.bringToBack) base.bringToBack(); };
L.control.scale({imperial: false}).addTo(map);

const say = t => $('#info').textContent = t || '';

/* ---------- rasters ---------- */
const rasters = []; let uid = 0;
const get = id => rasters.find(r => r.id == id);

function reg(c) {  // projection definitions proj4 doesn't ship with
  if (!c || proj4.defs('EPSG:' + c)) return;
  if (c === 27700) proj4.defs('EPSG:27700', '+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy +towgs84=446.448,-125.157,542.06,0.15,0.247,0.842,-20.489 +units=m +no_defs');
  else if (c >= 32601 && c <= 32660) proj4.defs('EPSG:' + c, `+proj=utm +zone=${c - 32600} +datum=WGS84 +units=m +no_defs`);
  else if (c >= 32701 && c <= 32760) proj4.defs('EPSG:' + c, `+proj=utm +zone=${c - 32700} +south +datum=WGS84 +units=m +no_defs`);
  else if (c >= 25828 && c <= 25838) proj4.defs('EPSG:' + c, `+proj=utm +zone=${c - 25800} +ellps=GRS80 +units=m +no_defs`);
}

function colorFn(g) {
  const nd = g.noDataValue, n = g.numberOfRasters, mx = g.maxs || [], mn = g.mins || [];
  const hi = Math.max(mx[0] || 0, mx[1] || 0, mx[2] || 0) || 255, sc = hi > 255 ? 255 / hi : 1;
  return v => {
    if (n >= 3) {
      if (isNaN(v[0]) || (n === 4 && v[3] === 0)) return null;
      if (nd != null && v[0] === nd && v[1] === nd && v[2] === nd) return null;
      return `rgb(${v[0] * sc | 0},${v[1] * sc | 0},${v[2] * sc | 0})`;
    }
    const x = v[0]; if (x == null || isNaN(x) || x === nd) return null;
    const lo = mn[0] ?? 0, h = mx[0] ?? 255;
    const t = Math.max(0, Math.min(255, (x - lo) / ((h - lo) || 1) * 255)) | 0;
    return `rgb(${t},${t},${t})`;
  };
}

async function addRaster(src, name) {
  say('Loading ' + name + '…');
  try {
    let g;
    try { g = await parseGeoraster(src); }
    catch (e) { if (src instanceof Blob) g = await parseGeoraster(await src.arrayBuffer()); else throw e; }
    reg(g.projection);
    const layer = new GeoRasterLayer({georaster: g, opacity: 1, resolution: 256, pixelValuesToColorFn: colorFn(g)});
    layer.addTo(map);
    rasters.push({id: ++uid, name, layer, vis: true});
    map.fitBounds(layer.getBounds());
    say(`${name}: ${g.width}×${g.height}, ${g.numberOfRasters} band(s), EPSG:${g.projection}`);
    render();
  } catch (e) { console.error(e); say('Could not load ' + name + ': ' + (e.message || e)); }
}

function render() {
  $('#layers').innerHTML = rasters.map(r => `<div class="lr"><label><input type="checkbox" data-a="vis" data-i="${r.id}" ${r.vis ? 'checked' : ''}><span title="${esc(r.name)}">${esc(r.name)}</span></label>
    <input type="range" min="0" max="1" step=".05" value="${r.layer.options.opacity}" data-a="op" data-i="${r.id}">
    <button data-a="zoom" data-i="${r.id}">Zoom</button><button data-a="del" data-i="${r.id}">×</button></div>`).join('')
    || '<p class="hint">Open or drop a GeoTIFF / COG to begin.</p>';
  for (const [sel, def] of [['#selL', 0], ['#selR', rasters.length - 1]]) {
    const el = $(sel), old = el.value;
    el.innerHTML = rasters.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('');
    el.value = rasters.some(r => r.id == old) ? old : (rasters[Math.max(def, 0)] || {}).id;
  }
  applyCmp();
}

$('#layers').addEventListener('input', e => {
  const d = e.target.dataset; if (d.a !== 'op') return;
  get(d.i).layer.setOpacity(+e.target.value);
});
$('#layers').addEventListener('click', e => {
  const d = e.target.dataset, r = d.i && get(d.i); if (!r) return;
  if (d.a === 'zoom') map.fitBounds(r.layer.getBounds());
  if (d.a === 'del') { map.removeLayer(r.layer); rasters.splice(rasters.indexOf(r), 1); render(); }
  if (d.a === 'vis') { r.vis = e.target.checked; r.vis ? r.layer.addTo(map) : map.removeLayer(r.layer); clip(); }
});

$('#open').onclick = () => $('#file').click();
$('#file').onchange = e => { [...e.target.files].forEach(f => addRaster(f, f.name)); e.target.value = ''; };
$('#url').onclick = () => { const u = prompt('COG / GeoTIFF URL (server must allow CORS and range requests)'); if (u) addRaster(u, u.split('/').pop().split('?')[0] || 'remote'); };
addEventListener('dragover', e => { e.preventDefault(); $('#drop').style.display = 'grid'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').style.display = 'none'; });
addEventListener('drop', e => { e.preventDefault(); $('#drop').style.display = 'none'; [...e.dataTransfer.files].forEach(f => addRaster(f, f.name)); });
const qs = new URLSearchParams(location.search).get('url'); if (qs) addRaster(qs, qs.split('/').pop());

/* ---------- swipe compare ---------- */
const cmp = {on: false, r: 0.5};
function clip() {
  if (!cmp.on) return;
  const s = map.getSize(), nw = map.containerPointToLayerPoint([0, 0]), se = map.containerPointToLayerPoint(s), x = nw.x + s.x * cmp.r;
  const set = (id, c) => { const r = get(id), el = r && r.layer.getContainer(); if (el) el.style.clip = c; };
  set($('#selL').value, `rect(${nw.y}px,${x}px,${se.y}px,${nw.x}px)`);
  set($('#selR').value, `rect(${nw.y}px,${se.x}px,${se.y}px,${x}px)`);
}
function applyCmp() {
  rasters.forEach(r => { const el = r.layer.getContainer(); if (el) el.style.clip = ''; });
  cmp.on = $('#cmpOn').checked && rasters.length > 1 && $('#selL').value !== $('#selR').value;
  $('#cmp').style.display = cmp.on ? 'block' : 'none';
  if (cmp.on) {
    [$('#selL').value, $('#selR').value].forEach(id => { const r = get(id); r.vis = true; r.layer.addTo(map); });
    $('#bar').style.left = cmp.r * 100 + '%'; clip();
    $('#layers').querySelectorAll('[data-a=vis]').forEach(c => c.checked = get(c.dataset.i).vis);
  }
}
['#cmpOn', '#selL', '#selR'].forEach(s => $(s).onchange = applyCmp);
map.on('move zoom resize viewreset zoomend', clip);
$('#bar').addEventListener('pointerdown', e => {
  e.target.setPointerCapture(e.pointerId); map.dragging.disable();
  const mv = ev => { const b = $('#map').getBoundingClientRect(); cmp.r = Math.min(1, Math.max(0, (ev.clientX - b.left) / b.width)); $('#bar').style.left = cmp.r * 100 + '%'; clip(); };
  const up = () => { map.dragging.enable(); e.target.removeEventListener('pointermove', mv); e.target.removeEventListener('pointerup', up); };
  e.target.addEventListener('pointermove', mv); e.target.addEventListener('pointerup', up);
});

/* ---------- measure + notes ---------- */
const sty = {color: '#f2b84b', weight: 3, fillOpacity: .15};
const fg = L.layerGroup().addTo(map); let feats = [], tool = null, cur = null;
const hints = {dist: 'Click to add points along the line.', area: 'Click to outline an area.', note: 'Click the map to place a note.'};

function len(pts) { let d = 0; for (let i = 1; i < pts.length; i++) d += map.distance(pts[i - 1], pts[i]); return d; }
function area(pts) {
  const R = 6371008.8, r = x => x * Math.PI / 180; let s = 0;
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += (r(b.lng) - r(a.lng)) * (2 + Math.sin(r(a.lat)) + Math.sin(r(b.lat))); }
  return Math.abs(s * R * R / 2);
}
const fmtL = m => m < 1000 ? m.toFixed(m < 10 ? 2 : 1) + ' m' : (m / 1000).toFixed(3) + ' km';
const fmtA = a => a < 1e4 ? a.toFixed(1) + ' m²' : a < 1e6 ? (a / 1e4).toFixed(2) + ' ha' : (a / 1e6).toFixed(3) + ' km²';
const label = (k, p) => k === 'area' ? `${fmtA(area(p))}, perimeter ${fmtL(len([...p, p[0]]))}` : fmtL(len(p));

function setTool(t) {
  finish(true); tool = t === tool ? null : t;
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tool));
  map.getContainer().style.cursor = tool ? 'crosshair' : '';
  tool ? map.doubleClickZoom.disable() : map.doubleClickZoom.enable();
  say(tool ? hints[tool] : '');
}
function keep(layer, kind, text, tipOpts) {
  layer.bindTooltip(text, {permanent: true, className: 'tip', ...tipOpts}).addTo(fg);
  const f = {layer, kind, label: text}; feats.push(f);
  layer.on('contextmenu', ev => { L.DomEvent.stop(ev); fg.removeLayer(layer); feats = feats.filter(x => x !== f); });
}
function finish(cancel) {
  if (!cur) return;
  const min = cur.kind === 'area' ? 3 : 2;
  map.removeLayer(cur.line);
  if (!cancel && cur.pts.length >= min) {
    const l = (cur.kind === 'area' ? L.polygon : L.polyline)(cur.pts, sty);
    keep(l, cur.kind, label(cur.kind, cur.pts), {direction: 'center'});
    say(label(cur.kind, cur.pts));
  }
  cur = null;
}
map.on('click', e => {
  if (!tool) return;
  if (tool === 'note') { const t = prompt('Note text'); if (t) keep(L.marker(e.latlng, {icon: L.divIcon({className: 'pin', iconSize: [14, 14]})}), 'note', t, {direction: 'right', offset: [8, 0]}); return; }
  if (!cur) cur = {kind: tool, pts: [], line: (tool === 'area' ? L.polygon : L.polyline)([], sty).addTo(map)};
  cur.pts.push(e.latlng); cur.line.setLatLngs(cur.pts);
});
map.on('dblclick', () => { if (cur) { cur.pts.pop(); finish(); } });
map.on('mousemove', e => {
  const c = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
  if (cur) { const p = [...cur.pts, e.latlng]; cur.line.setLatLngs(p); if (p.length > 1) return say(label(cur.kind, p) + '\n' + c); }
  if (!tool) say(c);
});
addEventListener('keydown', e => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') { finish(true); if (tool) setTool(tool); } });
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => setTool(b.dataset.t));
$('#undo').onclick = () => { const f = feats.pop(); if (f) fg.removeLayer(f.layer); };
$('#clear').onclick = () => { if (feats.length && confirm('Remove all measurements and notes?')) { fg.clearLayers(); feats = []; } };
$('#exp').onclick = () => {
  const fc = {type: 'FeatureCollection', features: feats.map(f => ({...f.layer.toGeoJSON(), properties: {kind: f.kind, label: f.label}}))};
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([JSON.stringify(fc, null, 2)], {type: 'application/geo+json'})), download: 'annotations.geojson'});
  a.click(); URL.revokeObjectURL(a.href);
};
render();
</script>
</body>
</html>
